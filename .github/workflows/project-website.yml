name: Project website

on:
  pull_request:
    paths:
      - 'software/project_website/**'
      - 'docs/data/**'
      - '.github/workflows/project-website.yml'
  push:
    branches: [main]
    paths:
      - 'software/project_website/**'
      - 'docs/data/**'
      - '.github/workflows/project-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/project_website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npx --yes pnpm@10.34.3 install --frozen-lockfile
      - name: Type-check and build
        run: npx --yes pnpm@10.34.3 build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: software/project_website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy reviewed website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
