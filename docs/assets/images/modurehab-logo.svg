<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160" fill="none" role="img" aria-labelledby="title description">
  <title id="title">ModuRehab Home</title>
  <desc id="description">ModuRehab Home wordmark beside a blue and teal modular arm and joint symbol with connected sensing nodes.</desc>

  <!-- The icon geometry matches modurehab-icon.svg. -->
  <g id="icon">
    <g id="arm" stroke-linecap="round" stroke-linejoin="round">
      <path id="upper-arm" d="M48 53V101" stroke="#2463C5" stroke-width="18"/>
      <path id="forearm" d="M60 111L112 76" stroke="#0C9488" stroke-width="18"/>
      <path id="hand" d="M112 76L119 65Q122 60 128 64L135 69" stroke="#0C9488" stroke-width="12"/>
      <circle id="elbow" cx="49" cy="113" r="17" stroke="#2463C5" stroke-width="9"/>
      <circle id="joint-center" cx="49" cy="113" r="5" fill="#0C9488"/>
      <rect id="modular-attachment" x="34" y="25" width="28" height="23" rx="7" stroke="#2463C5" stroke-width="7"/>
    </g>
    <path id="movement" d="M77 132A36 36 0 0 0 86 101" stroke="#0C9488" stroke-width="4" stroke-linecap="round"/>
    <g id="sensing-network" stroke="#2463C5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M86 34L108 25L127 40M108 25V49"/>
      <circle cx="86" cy="34" r="5" fill="#2463C5" stroke="none"/>
      <circle cx="108" cy="25" r="5" fill="#0C9488" stroke="none"/>
      <circle cx="127" cy="40" r="5" fill="#2463C5" stroke="none"/>
      <circle cx="108" cy="49" r="5" fill="#0C9488" stroke="none"/>
    </g>
  </g>

  <!-- Live text stays editable; no external fonts or assets are required. -->
  <text id="wordmark" x="178" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="48" letter-spacing="-1.3">
    <tspan fill="#2463C5" font-weight="700">ModuRehab</tspan><tspan dx="12" fill="#0C9488" font-weight="400">Home</tspan>
  </text>
</svg>
